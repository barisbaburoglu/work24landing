# Host Nginx'e ekleyin (80/443). Landing konteyneri 18082 dinler.
# API 18080, panel 18081 — bu bloklar onlara dokunmaz.

server {
    listen 80;
    server_name work24.io www.work24.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://work24.io$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.work24.io;

    ssl_certificate /etc/letsencrypt/live/work24.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/work24.io/privkey.pem;

    return 301 https://work24.io$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name work24.io;

    ssl_certificate /etc/letsencrypt/live/work24.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/work24.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 8m;

    location / {
        proxy_pass http://host.docker.internal:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
