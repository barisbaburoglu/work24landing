server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    absolute_redirect off;

    location = /faq.html { return 301 /faq; }
    location = /solutions.html { return 301 /solutions; }
    location = /contact.html { return 301 /contact; }
    location = /privacy.html { return 301 /privacy; }
    location = /delete-account.html { return 301 /delete-account; }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
