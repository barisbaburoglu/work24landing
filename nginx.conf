server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    absolute_redirect off;

    location = / {
        return 301 /tr;
    }

    location = /faq.html { return 301 /tr/sss; }
    location = /solutions.html { return 301 /tr/cozumler; }
    location = /contact.html { return 301 /tr/iletisim; }
    location = /privacy.html { return 301 /tr/gizlilik; }
    location = /delete-account.html { return 301 /tr/hesap-silme; }

    location = /faq { return 301 /tr/sss; }
    location = /solutions { return 301 /tr/cozumler; }
    location = /contact { return 301 /tr/iletisim; }
    location = /privacy { return 301 /tr/gizlilik; }
    location = /delete-account { return 301 /tr/hesap-silme; }
    location = /sss { return 301 /tr/sss; }
    location = /cozumler { return 301 /tr/cozumler; }
    location = /iletisim { return 301 /tr/iletisim; }
    location = /gizlilik { return 301 /tr/gizlilik; }
    location = /hesap-silme { return 301 /tr/hesap-silme; }

    location = /ozellikler { return 301 /tr/ozellikler; }
    location = /features { return 301 /tr/ozellikler; }
    location = /nasil-calisir { return 301 /tr/nasil-calisir; }
    location = /how-it-works { return 301 /tr/nasil-calisir; }
    location = /fiyatlandirma { return 301 /tr/fiyatlandirma; }
    location = /pricing { return 301 /tr/fiyatlandirma; }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
