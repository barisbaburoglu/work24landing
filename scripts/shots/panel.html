<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Work24 shot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #43c2f3;
      --green: #7ed957;
      --green-dark: #2bb673;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --canvas: #f4f7fb;
      --white: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: "DM Sans", sans-serif; background: #020617; color: var(--ink); }
    .shell { display: flex; width: 100%; height: 100vh; overflow: hidden; background: #020617; }
    .sidebar { width: 280px; height: 100%; background: #020617; color: #e2e8f0; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
    .sidebar-brand { padding: 16px 20px 12px; flex-shrink: 0; }
    .brand-logo { height: 32px; width: auto; max-width: 140px; object-fit: contain; display: block; }
    .sidebar-nav { flex: 1; min-height: 0; overflow: hidden; padding: 0 12px 16px; }
    .g { margin: 0 12px 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #64748b; font-weight: 700; }
    .sidebar-group { margin-bottom: 16px; }
    .link { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 12px; color: #cbd5e1; font-size: 14px; margin-bottom: 2px; }
    .link svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .85; }
    .link.active { background: rgba(255,255,255,.08); color: #fff; }
    .main { flex: 1; min-width: 0; background: var(--canvas); display: flex; flex-direction: column; }
    .topbar { flex-shrink: 0; background: rgba(255,255,255,.9); border-bottom: 1px solid var(--line); }
    .topbar-inner { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; }
    .top-l, .top-r { display: flex; align-items: center; gap: 12px; }
    .menu-btn { border: 0; background: none; padding: 8px; color: var(--ink); border-radius: 8px; font-size: 20px; line-height: 1; }
    .locale { display: inline-flex; align-items: center; gap: 8px; min-width: 118px; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 10px; }
    .locale-code { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 22px; padding: 0 6px; border-radius: 7px; background: #e2e8f0; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .locale-name { font-size: 13px; font-weight: 600; }
    .locale-chevron { color: #64748b; font-size: 10px; }
    .bell { width: 40px; height: 40px; border: 0; background: transparent; color: var(--ink); border-radius: 10px; display: grid; place-items: center; font-size: 18px; }
    .profile { display: flex; align-items: center; gap: 12px; }
    .topbar-user { text-align: right; }
    .topbar-user p { margin: 0; font-size: 14px; font-weight: 600; }
    .topbar-user span { font-size: 12px; color: var(--muted); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .content { flex: 1; min-height: 0; padding: 24px 32px; overflow: hidden; }
    .dash { max-width: 1280px; }
    .dash-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
    .page-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
    .page-header h2 { font-size: 24px; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.4; }
    .date { color: #94a3b8; font-size: 12px; font-weight: 500; margin-top: 8px; }
    .btn { border: 0; border-radius: 12px; padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: default; }
    .btn-p { background: var(--ink); color: #fff; }
    .btn-g { background: transparent; color: var(--muted); }
    .btn-sm { padding: 10px 16px; font-size: 13px; border-radius: 10px; }
    .live { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .live-l { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #047857; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-dark); box-shadow: 0 0 0 3px rgba(43,182,115,.18); }
    .upd { font-size: 12px; color: #94a3b8; }
    .stats { display: grid; grid-template-columns: repeat(4,1fr); background: #fff; border: 1px solid rgba(15,23,42,.08); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    .stat { padding: 18px 20px 16px; position: relative; text-align: left; }
    .stat + .stat { border-left: 1px solid rgba(15,23,42,.08); }
    .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .s1::before { background: var(--green-dark); }
    .s2::before { background: #d97706; }
    .s3::before { background: #0284c7; }
    .s4::before { background: #e11d48; }
    .stat span { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
    .stat strong { display: block; margin-top: 8px; font-size: 28px; letter-spacing: -.04em; line-height: 1; }
    .stat small { margin-left: 2px; font-size: 14px; font-weight: 600; color: #94a3b8; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; min-width: 0; }
    .plan { grid-column: 1 / -1; }
    .panel { background: #fff; border: 1px solid rgba(15,23,42,.08); border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(15,23,42,.04); min-width: 0; overflow: hidden; }
    .ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .ph h3 { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .ph-title { display: flex; align-items: center; gap: 4px; }
    .expand { width: 32px; height: 32px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); display: grid; place-items: center; font-size: 14px; }
    .muted { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
    .empty { display: flex; align-items: center; justify-content: center; min-height: 72px; margin: 4px 0 0; padding: 16px; border-radius: 10px; background: #f8fafc; color: #94a3b8; font-size: 12px; text-align: center; }
    table.plan-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .plan-table th, .plan-table td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #f1f5f9; }
    .plan-table th { color: #64748b; font-weight: 600; font-size: 11px; }
    .plan-table th:first-child, .plan-table td:first-child { text-align: left; min-width: 120px; }
    .cell { display: flex; align-items: center; justify-content: center; min-height: 30px; min-width: 72px; padding: 2px 4px; border-radius: 6px; font-size: 11px; }
    .cell.work { background: #fff; color: var(--ink); }
    .cell.off { background: #fecaca; color: #991b1b; font-weight: 600; }
    .cell.leave { background: #fdba74; color: #9a3412; font-weight: 600; }
    .cell.holiday { background: #cbd5e1; color: #334155; font-weight: 600; }
    .tabs { display: flex; gap: 2px; padding: 3px; margin-bottom: 14px; background: #f1f5f9; border-radius: 10px; }
    .tab { flex: 1; border: 0; background: transparent; padding: 8px 10px; font: inherit; font-size: 12px; font-weight: 600; color: var(--muted); border-radius: 8px; text-align: center; }
    .tab.on { color: var(--ink); background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.08); }
    .req-head, .req-row { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr) minmax(0,.8fr); gap: 8px; align-items: center; font-size: 12px; min-width: 0; }
    .req-head { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; padding: 0 10px 8px; }
    .req-row { padding: 10px; border-radius: 10px; border-left: 3px solid #f59e0b; }
    .req-row.ok { border-left-color: #10b981; }
    .req-row.bad { border-left-color: #ef4444; }
    .req-row span:first-child { font-weight: 600; }
    .search { width: 160px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; background: #fafbfc; }
    .notif { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 12px 4px; border-bottom: 1px solid #f1f5f9; }
    .notif:last-child { border-bottom: 0; }
    .notif strong { display: block; font-size: 13px; font-weight: 650; }
    .notif p { margin: 4px 0 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .notif em { display: inline-block; margin-top: 6px; font-style: normal; font-size: 11px; font-weight: 600; color: #0369a1; background: #f0f9ff; padding: 2px 8px; border-radius: 6px; }
    .activity { margin-top: 16px; }
    .act-item { display: grid; grid-template-columns: 12px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 10px 2px; border-bottom: 1px solid #f1f5f9; }
    .act-item:last-child { border-bottom: 0; }
    .act-dot { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: #f59e0b; }
    .act-dot.ok { background: #10b981; }
    .act-dot.info { background: #3b82f6; }
    .act-item strong { display: block; font-size: 13px; font-weight: 650; color: var(--ink); line-height: 1.35; }
    .act-item p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .act-item time { font-size: 11px; font-weight: 600; color: #94a3b8; white-space: nowrap; padding-top: 2px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 20px; background: #fff; box-shadow: 0 8px 24px rgba(15,23,42,.06); margin-bottom: 12px; }
    .toolbar input, .toolbar select { height: 42px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: #fff; font: inherit; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .lg { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
    .lg.work { background: #ecfdf5; color: #047857; }
    .lg.off { background: #fff1f2; color: #be123c; }
    .lg.leave { background: #ffedd5; color: #9a3412; }
    .lg.holiday { background: #e2e8f0; color: #334155; }
    .hint { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    .day-wrap { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(15,23,42,.06); }
    .day-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .day-table th, .day-table td { border: 1px solid var(--line); padding: 8px; text-align: center; min-width: 72px; }
    .day-table th:first-child, .day-table td:first-child { text-align: left; min-width: 160px; background: #fff; }
    .day-head { display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.2; }
    .day-head small { font-weight: 500; color: var(--muted); font-size: 11px; }
    .emp { display: grid; gap: 2px; text-align: left; }
    .emp small { color: var(--muted); }
    .rtabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .rtab { border: 0; background: transparent; padding: 10px 14px; font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
    .rtab.on { color: var(--ink); border-bottom-color: var(--blue); }
    .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 8px 24px rgba(15,23,42,.06); }
    .rtb { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .rtb h3 { font-size: 15px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .filters input, .filters select { flex: 1 1 160px; border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; background: #fff; font: inherit; }
    .lhead, .lrow { display: grid; grid-template-columns: .6fr 1.2fr 1fr .9fr .9fr .8fr auto; gap: 8px; align-items: center; font-size: 12px; padding: 8px 10px; }
    .lhead { color: var(--muted); font-weight: 700; }
    .lrow { border-radius: 10px; border-right: 4px solid #f59e0b; }
    .lrow.ok { border-right-color: #10b981; }
    .lrow.bad { border-right-color: #ef4444; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.wait { background: #ffedd5; color: #9a3412; }
    .badge.ok { background: #ecfdf5; color: #047857; }
    .badge.bad { background: #fff1f2; color: #be123c; }
    .ico-btn { border: 0; background: #f8fafc; color: var(--ink); border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 600; }
    .ts-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px; padding: 12px 14px; border-radius: 20px; background: #fff; box-shadow: 0 8px 24px rgba(15,23,42,.06); margin-bottom: 12px; }
    .ts-field { display: flex; flex-direction: column; gap: 6px; min-width: 148px; }
    .ts-field span { font-size: 12px; color: var(--muted); font-weight: 500; }
    .ts-field select, .ts-field input { height: 40px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: #fff; font: inherit; }
    .ts-month { display: flex; align-items: center; gap: 8px; min-height: 40px; }
    .ts-month strong { min-width: 128px; text-align: center; font-size: 15px; }
    .ts-nav { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .ts-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn-x { background: #f8fafc; border: 1px solid var(--line); color: var(--ink); }
    .ts-stats { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin-bottom: 12px; }
    .ts-stats article { padding: 12px 14px; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
    .ts-stats span { display: block; color: var(--muted); font-size: 12px; }
    .ts-stats strong { display: block; margin-top: 6px; font-size: 20px; letter-spacing: -.03em; }
    .ts-sheet { background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 8px 24px rgba(15,23,42,.06); overflow: hidden; }
    .ts-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
    .ts-head p { margin: 0; color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    .ts-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .ts-meta h3 { font-size: 17px; }
    .ts-meta strong { color: var(--muted); font-weight: 600; }
    .ts-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; }
    .ts-table th, .ts-table td { border-bottom: 1px solid #eef2f6; border-right: 1px solid #eef2f6; text-align: center; }
    .ts-table thead th { background: #f8fafc; color: var(--muted); font-weight: 600; padding: 6px 2px 8px; }
    .ts-sticky { text-align: left !important; min-width: 148px; padding: 8px 12px; background: #fff; font-weight: 600; }
    .ts-table thead .ts-sticky { background: #f8fafc; }
    .ts-day small { display: block; font-size: 9px; letter-spacing: .04em; text-transform: uppercase; color: #94a3b8; }
    .ts-day span { display: block; margin-top: 2px; color: var(--ink); font-size: 12px; }
    .ts-cell { min-width: 46px; height: 40px; padding: 3px 2px; }
    .ts-in, .ts-out { display: block; line-height: 1.25; font-variant-numeric: tabular-nums; }
    .ts-out { color: var(--muted); }
    .wk { background: #f8fafc; }
    .lv { background: #eef2ff; color: #3730a3; font-weight: 700; }
    .hol { background: #f1f5f9; color: #475569; font-weight: 700; }
    .abs { color: #94a3b8; }
    .late { box-shadow: inset 0 -2px 0 #f59e0b; }
    .late .ts-in { color: #b45309; font-weight: 700; }
    .ot .ts-out { color: #15803d; font-weight: 700; }
    .sum { min-width: 52px; padding: 8px 4px; background: #fafbfc; font-weight: 600; }
    body.mobile { background: transparent; display: flex; justify-content: center; align-items: center; }
    .phone { width: 390px; height: 844px; background: #f4f7fb; border-radius: 36px; overflow: hidden; box-shadow: none; display: flex; flex-direction: column; }
    .m-status { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 8px 22px 0; font-size: 12px; font-weight: 600; color: var(--ink); }
    .m-appbar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 4px; background: #fff; border-bottom: 1px solid var(--line); }
    .m-appbar .menu { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); font-size: 22px; }
    .m-logo { height: 28px; width: auto; }
    .m-app-r { display: flex; align-items: center; gap: 8px; }
    .m-lang { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; font-size: 12px; font-weight: 700; background: #fff; }
    .m-av { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px; margin-right: 8px; }
    .m-body { padding: 8px 16px 12px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .m-body h1 { font-size: 26px; letter-spacing: -.6px; line-height: 1.15; }
    .m-sub { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.4; }
    .m-date { text-align: right; font-size: 16px; font-weight: 700; letter-spacing: -.2px; margin-top: 8px; }
    .clock { background: #fff; border: 1px solid rgba(15,23,42,.08); border-radius: 14px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; margin: 20px 0 16px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    .clock .t { font-size: 32px; font-weight: 700; letter-spacing: -1.2px; line-height: 1; }
    .qr { background: #fff; border: 1px solid rgba(15,23,42,.08); border-radius: 14px; padding: 20px; text-align: center; flex: 1; min-height: 0; display: flex; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    .qr-box { background: #e8f7fd; border-radius: 16px; padding: 20px 16px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .qr-ico { width: 96px; height: 96px; color: var(--blue); }
    .qr-title { font-weight: 700; margin-top: 14px; font-size: 16px; letter-spacing: -.2px; }
    .inkbtn { width: 100%; height: 44px; margin-top: 12px; background: var(--ink); color: #fff; border: 0; border-radius: 12px; font-weight: 600; font-size: 14px; flex-shrink: 0; }
    .strip { margin-top: 16px; background: #fff; border: 1px solid rgba(15,23,42,.08); border-radius: 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.04); flex-shrink: 0; }
    .sc { padding: 14px 10px 14px 12px; display: flex; gap: 8px; align-items: center; min-width: 0; }
    .sc + .sc { border-left: 1px solid var(--line); }
    .sc i { width: 3px; height: 36px; border-radius: 99px; flex-shrink: 0; }
    .sc.is-in i { background: #7ed957; }
    .sc.is-out i { background: #d97706; }
    .sc.is-hrs i { background: #43c2f3; }
    .sc > div { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .sc span {
      display: block;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 14px;
      height: 14px;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sc strong {
      display: block;
      margin-top: 6px;
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.4px;
      line-height: 20px;
      height: 20px;
      font-variant-numeric: tabular-nums;
    }
    .m-tabs { height: 72px; background: #fff; border-radius: 40px 40px 0 0; display: grid; grid-template-columns: repeat(5,1fr); padding: 8px 4px 10px; flex-shrink: 0; }
    .m-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9ca3af; font-size: 11px; font-weight: 500; }
    .m-tab svg { width: 24px; height: 24px; }
    .m-tab.on { color: #43c2f3; font-weight: 600; }
  </style>
</head>
<body>
<script>
  const page = new URLSearchParams(location.search).get('p') || 'dashboard'
  document.body.classList.toggle('mobile', page === 'mobile')

  const ico = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`
  const icons = {

      const sums = (w, l, late, ot, miss, tot) =>

        [ppl.burak, `${io('08:30','18:31')}${io('08:28','18:30')}${io('08:30','18:33')}${io('08:31','18:29')}${io('08:30','18:30')}${wk}${wk}${io('08:29','18:32')}${io('08:30','18:30')}${io('08:32','18:31')}${sums(22,0,0,'0:00','0:00','176:00')}`],

            <p class="sub">${copy.tsSub}</p>

          <div class="ts-field"><span>&nbsp;</span><div class="ts-month"><button class="ts-nav" type="button">‹</button><strong>${copy.tsMonth}</strong><button class="ts-nav" type="button">›</button></div></div>

          <label class="ts-field"><span>${copy.location}</span><select><option>${copy.allLoc}</option></select></label>

            <button class="btn btn-x" type="button">${copy.payroll}</button>
            <button class="btn btn-x" type="button">${copy.lock}</button>
          </div>
        </div>
        <div class="ts-stats">
          <article><span>${copy.stPeople}</span><strong>5</strong></article>
          <article><span>${copy.stWork}</span><strong>848:30</strong></article>
          <article><span>${copy.stOt}</span><strong>1:30</strong></article>
          <article><span>${copy.stLeave}</span><strong>2</strong></article>
          <article><span>${copy.stLate}</span><strong>2</strong></article>
        </div>
        <section class="ts-sheet">
          <header class="ts-head">
            <p>${copy.sheet}</p>
            <div class="ts-meta"><h3>${copy.company}</h3><strong>${copy.tsMonth}</strong></div>
          </header>
          <table class="ts-table">
            <thead>
              <tr>
                <th class="ts-sticky">${copy.employee}</th>
                ${heads}

          ${tab('<path d="M12 21s7-6.2 7-11.2A7 7 0 1 0 5 9.8C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.2"/>', copy.tabEvent)}
          ${tab('<path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 21a2 2 0 0 0 4 0"/>', copy.tabNotice)}

          ${tab('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', copy.tabShift)}
        </nav>
      </div>`
    })()

  const html = views[page] || views.dashboard
  document.body.innerHTML = page === 'mobile' ? html : `<div class="shell">${html}</div>`
